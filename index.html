<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d16" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Masche & Co." />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Masche & Co. – Das Callcenter-Chaos mit Freunden. Alles fiktiv, alles erfunden." />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Masche &amp; Co.</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f0d16;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
        outline: none;
      }
      /* Misst die Safe Area (Notch, Home-Indicator) für das Spiel. */
      #safe-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate-hint {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
        text-align: center;
        color: #f7f3ea;
        background: #1d1a2b;
      }
      #rotate-hint[hidden] {
        display: none;
      }
      #rotate-hint p {
        margin: 0;
        max-width: 320px;
        font-size: 20px;
        line-height: 1.4;
      }
      #rotate-hint button {
        font: 700 17px system-ui, sans-serif;
        min-height: 56px;
        padding: 0 22px;
        border: 3px solid #f2b134;
        border-radius: 0;
        background: #2c2840;
        color: #f2b134;
        box-shadow: 4px 4px 0 #0f0d16;
        cursor: pointer;
      }
      /* Pixel-Handy, das sich ins Querformat dreht. */
      .rotate-phone {
        width: 48px;
        height: 84px;
        background: #f2b134;
        box-shadow:
          0 0 0 6px #0f0d16,
          inset 0 0 0 6px #c27d1c,
          inset 0 -18px 0 6px #c27d1c;
        animation: tilt 2.4s steps(6) infinite;
      }
      @keyframes tilt {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rotate-phone {
          animation: none;
          transform: rotate(-90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="rotate-hint" role="dialog" aria-modal="true" hidden>
      <div class="rotate-phone" aria-hidden="true"></div>
      <p data-i18n="orientation.hint"></p>
      <button id="rotate-continue" type="button" data-i18n="orientation.continue"></button>
    </div>
    <noscript><p style="color: #f7f3ea; padding: 24px">Masche &amp; Co. braucht JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
