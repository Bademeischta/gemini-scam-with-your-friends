<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14151f">
<meta name="mobile-web-app-capable" content="yes">
<title>Masche &amp; Co.</title>
<style>
  html,body{margin:0;height:100%;background:#14151f;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
  #safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;box-sizing:border-box;text-align:center;color:#f4f1e8;z-index:9;
    background:radial-gradient(circle at 50% 40%,#2a2d45,#14151f)}
  #rotate.show{display:flex}
  #rotate .ph{font-size:72px;animation:tilt 2.4s ease-in-out infinite}
  #rotate p{margin:0;max-width:320px;font-size:20px;line-height:1.4}
  #rotate button{font:700 16px system-ui,sans-serif;background:#ffcc3d;color:#14151f;border:0;border-radius:14px;padding:12px 18px;cursor:pointer}
  @keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="rotate">
  <div class="ph">📱</div>
  <p>Dreh dein Handy quer – dann wird's erst richtig chaotisch. 😄</p>
  <button id="stayPortrait">Trotzdem hochkant spielen</button>
</div>
<script>
'use strict';

/* ================= TUNING – alle Werte zum Anpassen ================= */
const CFG = {
  SHIFT_TIME: 100,      // Sekunden pro Schicht
  QUOTA_BASE: 500,      // Team-Quota an Tag 1 (€)
  QUOTA_STEP: 300,      // Quota-Anstieg pro Tag (€)
  PAYOUT_BASE: 170,     // Auszahlung eines Erfolgs an Tag 1 (€)
  PAYOUT_STEP: 30,      // Auszahlungs-Anstieg pro Tag (€)
  COMBO_BONUS: 0.25,    // +25 % Auszahlung pro Combo-Stufe (Upgrade "Momentum" erhöht das)
  FIRE_COMBO: 4,        // ab dieser Combo: Feuer-Modus (Auszahlung x2)
  PATIENCE_BASE: 24,    // Geduld des Anrufers an Tag 1 (s)
  PATIENCE_MIN: 12,     // Untergrenze der Geduld (s)
  PATIENCE_STEP: 1.2,   // weniger Geduld pro Tag (s)
  RING_WINDOW: 4.5,     // Zeit zum Abnehmen an Tag 1 (s)
  RING_MIN: 2.5,        // Untergrenze der Abnehm-Zeit (s)
  RING_STEP: 0.2,       // weniger Abnehm-Zeit pro Tag (s)
  CALL_GAP: 0.9,        // Pause zwischen zwei Anrufen (s)
  TRUST_START: 20,      // Startvertrauen des Anrufers
  TRUST_BEST: 26,       // Vertrauen bei passendem Ansatz
  TRUST_NEUTRAL: 12,    // Vertrauen bei neutralem Ansatz
  TRUST_BAD: 4,         // Vertrauen bei Fehlgriff
  SUS_NEUTRAL: 9,       // Verdachtszuwachs bei neutralem Ansatz
  SUS_BAD: 26,          // Verdachtszuwachs bei Fehlgriff
  SUS_GROWTH: 0.07,     // +7 % Verdachtszuwachs pro Tag
  TRUST_GOAL: 100,      // ab hier ist der Anruf ein Erfolg
  SUS_MAX: 100,         // ab hier hat der Anrufer aufgelegt
  TYPE_SPEED: 45,       // Zeichen pro Sekunde (Schreibmaschinen-Effekt)
  TIP_TIME: 6,          // Sekunden pro Tipp
};

const W = 960, H = 540;   // logische Spielfläche (Querformat)

const PITCHES = [
  { id: 'charme',       label: 'Charme',      icon: '🥰', color: '#ff7ad9' },
  { id: 'dringend',     label: 'Dringend!',   icon: '😱', color: '#ff5d6c' },
  { id: 'amtlich',      label: 'Amtlich',     icon: '👔', color: '#5bc0ff' },
  { id: 'schnaeppchen', label: 'Schnäppchen', icon: '🤑', color: '#5ce07a' },
];
const FEEDBACK = { best: 'passt!', bad: 'autsch', neutral: 'mhm…' };

// Anrufer-Typen. best = zieht, bad = Fehlgriff. Der Typ ist zu Beginn verborgen.
const VICTIMS = [
  { name: 'Oma Gisela', emoji: '👵', tag: 'Ängstlich', best: 'dringend', bad: 'charme', sus: 0,
    open: 'Ist mein Enkel in Schwierigkeiten?! Sagen Sie mir die Wahrheit!',
    good: 'Oh Gott, ja, das klingt richtig! Ich hol schon mal das Sparschwein.',
    badR: 'Charme? Junger Mann, ich habe Angst und Sie wollen flirten?' },
  { name: 'Herr Bernd', emoji: '🧔', tag: 'Gierig', best: 'schnaeppchen', bad: 'amtlich', sus: 0,
    open: 'Ich hab gehört, es gibt was umsonst. Was gibt es denn?',
    good: 'Drei zum Preis von keinem? Bernd ist dabei!',
    badR: 'Amtlich? Ich wollte Rabatt, keine Amtsstube.' },
  { name: 'Kevin (34)', emoji: '🧑‍💻', tag: 'Einsam', best: 'charme', bad: 'schnaeppchen', sus: 0,
    open: 'Ähm … hey. Ich hab grad sonst niemanden zum Reden. Wer sind Sie?',
    good: 'Sie sind so nett! Erzählen Sie mir mehr, bitte!',
    badR: 'Ein Sonderangebot? Ich wollte einen Freund, kein Schnäppchen.' },
  { name: 'Dr. Specht', emoji: '🧑‍⚖️', tag: 'Autoritätsgläubig', best: 'amtlich', bad: 'dringend', sus: 0,
    open: 'Hier spricht Specht vom Bezirksamt. Ihr Anliegen, bitte.',
    good: 'Verstanden, Kollege. Ich unterschreibe sofort.',
    badR: 'Wer schreit denn so? Das ist unprofessionell!' },
  { name: 'Ralf (Skeptiker)', emoji: '🕵️', tag: 'Skeptisch', best: 'schnaeppchen', bad: 'charme', sus: 22,
    open: 'Moment. Woher haben Sie diese Nummer? Und warum klingen Sie so?',
    good: 'Hm … ok, das klingt tatsächlich nicht komplett bescheuert.',
    badR: 'Charme? Ich bin doch nicht bescheuert!' },
];

const LINES = {
  neutral: ['Hm. Erzählen Sie weiter …', 'Das klingt irgendwie … okay?', 'Mhm. Und dann?',
            'Moment, ich schreib das mit.', 'Ich bin nicht sicher, aber reden Sie ruhig weiter.'],
  success: ["Ich hab's getan! Mit Herz und Kreditkarte.", 'Das war mein bestes Gespräch seit Jahren!',
            'Ich fühl mich so … beschwingt. Danke!'],
  fail: ['Die Leitung ist tot. Wie ein Hering.', 'Mein Hund hat geknurrt. Tschüss!',
         'Ich ruf jetzt meinen Sohn an. Der ist Anwalt.'],
  bossOk: ['Quota erreicht. Gut. Heute gibt es Pizza, morgen wird es härter.',
           'Ich bin stolz auf euch. Also auf euch, nicht auf den Praktikanten.',
           'Sehr schön. Das Team darf bleiben. Der Kaktus auch.'],
  bossFail: ['Die Quota ist nicht erreicht. Packen Sie den Kaktus ein.',
             'Ich hab Verständnis. Null. Ihr Stuhl wird gebraucht.',
             'Das war ein Trauerspiel. Ein sehr teures Trauerspiel.'],
  over: ['Gefeuert! Immerhin ist die Lotterie noch offen. Ha. Nein.',
         'Ihr Schreibtisch ist ab sofort ein Pappkarton.',
         'Sie haben das Unternehmen verlassen. Mit Stil, aber ohne Gehalt.'],
  tips: ['Lies, was die Person sagt. Klingt sie ängstlich, gierig oder einsam?',
         'Der erste Versuch verrät, was zieht. Probier ihn aus!',
         'Jeder Ansatz hat einen Gegenspieler.',
         'Geduld ist eine Ressource. Gib sie nicht zu früh aus.'],
};

const UPGRADES = [
  { id: 'pat',   icon: '🧘', name: 'Geduldige Stimme', desc: '+5 s Geduld bei jedem Anruf' },
  { id: 'trust', icon: '📜', name: 'Gutes Skript',     desc: 'Passender Ansatz gibt +8 Vertrauen' },
  { id: 'sus',   icon: '☕', name: 'Espresso',         desc: 'Verdacht steigt 25 % langsamer' },
  { id: 'ring',  icon: '🎧', name: 'Headset Pro',      desc: '+1,5 s Zeit zum Abnehmen' },
  { id: 'combo', icon: '🔥', name: 'Momentum',         desc: 'Combo-Bonus +10 % pro Stufe' },
];

/* ================= Helfer ================= */
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = n => Math.round(n).toLocaleString('de-DE') + ' €';
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const quotaFor = d => CFG.QUOTA_BASE + CFG.QUOTA_STEP * (d - 1);

const canvas = $('c'), ctx = canvas.getContext('2d');
const SET = Object.assign({ sound: true, vib: true, shake: true }, load('masche.set') || {});
let hiScore = load('masche.best') || 0;
let input = matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse';
let rotOK = false, dpr = 1, VP = { ox: 0, oy: 0, sc: 1 }, T = 0, hits = [];
let parts = [], floats = [], stamps = [];
let scene = 'title';
let G = freshG();

function freshG() {
  return {
    day: 1, total: 0, bestCombo: 0,
    upg: { pat: 0, trust: 0, susMul: 1, ring: 0, comboMul: CFG.COMBO_BONUS },
    team: 0, quota: quotaFor(1), shiftLeft: CFG.SHIFT_TIME, combo: 0,
    okCalls: 0, failCalls: 0, missed: 0,
    call: null, ringing: false, ringLeft: 0, ringMax: 1, ringSfxT: 0, wait: 0,
    hitstop: 0, shake: 0, tipIdx: 0, tipT: CFG.TIP_TIME,
    reviewOK: false, quip: '', overQuip: '', upgChoices: [], pausedFrom: 'ring',
    mx: -999, my: -999, downX: 0, downY: 0, downT: 0,
  };
}

/* ================= Audio (Web Audio, komplett generiert) ================= */
let actx = null, master = null;
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, dur = 0.12, type = 'square', vol = 0.15, slide = 0, delay = 0) {
  if (!SET.sound || !actx || actx.state !== 'running') return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur = 0.2, vol = 0.12) {
  if (!SET.sound || !actx || actx.state !== 'running') return;
  const n = Math.floor(actx.sampleRate * dur), b = actx.createBuffer(1, n, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = actx.createBufferSource(), g = actx.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(master); s.start();
}
const SFX = {
  click: () => tone(660, 0.05, 'square', 0.08),
  hit:   () => { tone(520, 0.08, 'triangle', 0.2); tone(780, 0.1, 'triangle', 0.15, 0, 0.06); },
  bad:   () => tone(220, 0.25, 'sawtooth', 0.18, 90),
  ok:    () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.14, 'triangle', 0.2, 0, i * 0.07)),
  fail:  () => { tone(400, 0.35, 'sawtooth', 0.18, 80); noise(0.25, 0.12); },
  ring:  () => { tone(880, 0.18, 'sine', 0.18); tone(660, 0.18, 'sine', 0.18, 0, 0.22); },
  boss:  () => tone(140, 0.4, 'square', 0.15, 70),
  miss:  () => tone(300, 0.15, 'triangle', 0.12, 200),
};
function vib(p) { if (SET.vib && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }

/* ================= Zeichen-Helfer ================= */
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function text(s, x, y, size = 20, color = '#f4f1e8', align = 'left', weight = '700') {
  ctx.font = `${weight} ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function emoji(s, x, y, size) {
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, lh, size, color, align = 'left') {
  ctx.font = `600 ${size}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
  let line = '', yy = y;
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { text(line, x, yy, size, color, align, '600'); line = w; yy += lh; }
    else line = test;
  }
  if (line) text(line, x, yy, size, color, align, '600');
  return yy;
}
function panel(x, y, w, h, fill = 'rgba(20,22,36,0.84)', stroke = 'rgba(255,255,255,0.12)') {
  ctx.save(); rr(x, y, w, h, 18); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}
function bar(x, y, w, h, v, col) {
  v = Math.max(0, Math.min(1, v));
  ctx.save(); rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  if (v * w > 1) { rr(x, y, v * w, h, h / 2); ctx.fillStyle = col; ctx.fill(); }
  ctx.restore();
}
function meter(label, v, col, y) { text(label, 44, y, 15, '#c9cde6', 'left', '700'); bar(150, y - 6, 170, 12, v, col); }
function dim(a) { ctx.fillStyle = `rgba(8,8,14,${a})`; ctx.fillRect(-100, -100, W + 200, H + 200); }
function over(x, y, w, h) { return G.mx >= x && G.mx <= x + w && G.my >= y && G.my <= y + h; }
function hit(x, y, w, h, fn) { hits.push({ x, y, w, h, fn }); }
function button(x, y, w, h, label, fn, o = {}) {
  const hv = input !== 'touch' && over(x, y, w, h);
  ctx.save(); rr(x, y, w, h, 16); ctx.fillStyle = hv ? '#3d4370' : '#2a2e4a'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = o.stroke || '#ffcc3d'; ctx.stroke(); ctx.restore();
  text(label, x + w / 2, y + h / 2, o.size || 20, o.color || '#f4f1e8', 'center', '800');
  if (fn) hit(x, y, w, h, fn);
}
function iconBtn(x, y, icon, fn) {
  ctx.save(); rr(x, y, 38, 38, 12); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill(); ctx.restore();
  emoji(icon, x + 19, y + 20, 20); hit(x, y, 38, 38, fn);
}
function setInput(t) {
  const m = t === 'touch' ? 'touch' : 'mouse';
  if (input !== m) { input = m; checkRotate(); }
}

/* ================= Effekte ================= */
function burst(x, y, n, cols, spd = 260, life = 0.8) {
  for (let i = 0; i < n && parts.length < 400; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, life, max: life, c: pick(cols), r: 3 + Math.random() * 4, g: 520 });
  }
}
function floatT(s, x, y, c = '#5ce07a', size = 28) { floats.push({ s, x, y, c, size, t: 0, life: 1.1 }); }
function stamp(s, c, size = 64) { stamps.push({ s, c, size, t: 0, life: 1.2 }); }

function stepFX(dt) {
  G.shake = Math.max(0, G.shake - dt * 40);
  for (const p of parts) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.t += dt; f.y -= 40 * dt; }
  floats = floats.filter(f => f.t < f.life);
  for (const s of stamps) s.t += dt;
  stamps = stamps.filter(s => s.t < s.life);
  const c = G.call;
  if (c) {
    const k = 1 - Math.exp(-dt * 12);
    c.sx = lerp(c.sx, 1, k); c.sy = lerp(c.sy, 1, k);          // Squash & Stretch federt zurück
    if (c.shown < c.line.length) c.shown = Math.min(c.line.length, c.shown + dt * CFG.TYPE_SPEED);
  }
}

/* ================= Spielablauf ================= */
function newGame() { G = freshG(); startShift(); }
function startGame() { audio(); newGame(); }

function startShift() {
  Object.assign(G, { shiftLeft: CFG.SHIFT_TIME, team: 0, combo: 0, okCalls: 0, failCalls: 0, missed: 0,
    call: null, ringing: false, wait: 1.0, quota: quotaFor(G.day) });
  scene = 'ring';
}
function startRing() {
  G.ringing = true;
  G.ringMax = Math.max(CFG.RING_MIN, CFG.RING_WINDOW - CFG.RING_STEP * (G.day - 1)) + G.upg.ring;
  G.ringLeft = G.ringMax; G.ringSfxT = 0;
}
function startCall() {
  const v = pick(VICTIMS), d = G.day - 1;
  const pat = Math.max(CFG.PATIENCE_MIN, CFG.PATIENCE_BASE - CFG.PATIENCE_STEP * d) + G.upg.pat;
  G.call = { v, trust: CFG.TRUST_START, sus: v.sus, patience: pat, patMax: pat, tagKnown: false,
    done: false, endT: 0, last: null, lastKind: '', line: '', shown: 0, sx: 1, sy: 1 };
  setLine(v.open); scene = 'call'; vib(15);
}
function answer() {
  if (scene !== 'ring' || !G.ringing) return;
  G.ringing = false; SFX.click(); startCall();
}
function setLine(s) { G.call.line = s; G.call.shown = 0; }

function payout() {
  const base = CFG.PAYOUT_BASE + CFG.PAYOUT_STEP * (G.day - 1);
  const mult = 1 + G.upg.comboMul * G.combo;
  const fire = G.combo >= CFG.FIRE_COMBO ? 2 : 1;
  return Math.round(base * mult * fire / 10) * 10;
}

function pitch(i) {
  const c = G.call;
  if (scene !== 'call' || !c || c.done) return;
  const p = PITCHES[i], v = c.v, sg = (1 + CFG.SUS_GROWTH * (G.day - 1)) * G.upg.susMul;
  let kind, dT, dS, line;
  if (p.id === v.best)      { kind = 'best';    dT = CFG.TRUST_BEST + G.upg.trust; dS = 0;               line = v.good; }
  else if (p.id === v.bad)  { kind = 'bad';     dT = CFG.TRUST_BAD;                dS = CFG.SUS_BAD * sg; line = v.badR; }
  else                      { kind = 'neutral'; dT = CFG.TRUST_NEUTRAL;            dS = CFG.SUS_NEUTRAL * sg; line = pick(LINES.neutral); }
  c.trust = Math.min(100, c.trust + dT);
  c.sus = Math.min(100, c.sus + dS);
  c.tagKnown = true; c.last = p; c.lastKind = kind;
  setLine(line);
  if (kind === 'bad') { c.sx = 0.8; c.sy = 1.2; SFX.bad(); vib([40, 30, 60]); G.shake = Math.max(G.shake, 10); }
  else if (kind === 'best') { c.sx = 1.25; c.sy = 0.8; SFX.hit(); vib(20); G.hitstop = 0.07; burst(182, 170, 10, [p.color, '#ffffff'], 200, 0.5); }
  else { c.sx = 1.1; c.sy = 0.9; SFX.hit(); vib(10); }
  floatT('+' + Math.round(dT), 150, 120, '#5ce07a', 26);
  if (dS > 0) floatT('+' + Math.round(dS), 230, 120, '#ff5d6c', 26);
  if (c.trust >= CFG.TRUST_GOAL) return success();
  if (c.sus >= CFG.SUS_MAX) return fail('AUFGELEGT!');
}

function success() {
  const c = G.call; c.done = true; c.endT = 1.7;
  const pay = payout();
  G.team += pay; G.total += pay; G.okCalls++;
  G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
  setLine(pick(LINES.success));
  burst(182, 170, 46, ['#ffcc3d', '#5ce07a', '#5bc0ff', '#ff7ad9'], 420, 1.1);
  floatT('+' + fmt(pay), 480, 200, '#ffcc3d', 40);
  stamp('GESCHAFFT!', '#5ce07a', 70);
  if (G.combo === CFG.FIRE_COMBO) stamp('FEUER-MODUS!', '#ff8a3d', 60);
  else if (G.combo >= 2) floatT('COMBO x' + G.combo, 480, 300, '#ff8a3d', 30);
  SFX.ok(); vib([30, 40, 60]); G.shake = 8;
}

function fail(reason) {
  const c = G.call; c.done = true; c.endT = 1.8;
  G.failCalls++; G.combo = 0;
  setLine(pick(LINES.fail));
  stamp(reason, '#ff5d6c', 60);
  burst(182, 170, 24, ['#ff5d6c', '#ffffff', '#9aa0c4'], 260, 0.8);
  SFX.fail(); vib([80, 40, 120]); G.shake = 14;
}

function endShift() {
  G.call = null; G.ringing = false;
  G.quota = quotaFor(G.day);
  G.reviewOK = G.team >= G.quota;
  G.quip = pick(G.reviewOK ? LINES.bossOk : LINES.bossFail);
  scene = 'review'; SFX.boss(); vib(G.reviewOK ? 60 : [200, 100, 200]);
}
function continueReview() {
  if (G.reviewOK) {
    G.upgChoices = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
    scene = 'upgrade';
  } else gameOver();
}
function chooseUpgrade(u) {
  const up = G.upg;
  if (u.id === 'pat') up.pat += 5;
  if (u.id === 'trust') up.trust += 8;
  if (u.id === 'sus') up.susMul *= 0.75;
  if (u.id === 'ring') up.ring += 1.5;
  if (u.id === 'combo') up.comboMul += 0.10;
  G.day++; SFX.ok(); startShift();
}
function gameOver() {
  if (G.total > hiScore) { hiScore = G.total; save('masche.best', hiScore); }
  G.overQuip = pick(LINES.over);
  scene = 'over'; SFX.fail(); vib([200, 80, 200]);
}

function togglePause() {
  SFX.click();
  if (scene === 'pause') scene = G.pausedFrom;
  else if (['ring', 'call', 'review'].includes(scene)) { G.pausedFrom = scene; scene = 'pause'; }
}
function autoPause() { if (['ring', 'call', 'review'].includes(scene)) { G.pausedFrom = scene; scene = 'pause'; } }
function goTitle() { scene = 'title'; }
function toggleSound() { SET.sound = !SET.sound; save('masche.set', SET); if (SET.sound) SFX.click(); }
function toggleFS() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen)?.call(d);
  else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
}

/* ================= Update ================= */
function update(dt) {
  stepFX(dt);
  if (scene !== 'ring' && scene !== 'call') return;
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  G.shiftLeft -= dt;
  if (G.shiftLeft <= 0) { endShift(); return; }
  G.tipT -= dt;
  if (G.tipT <= 0) { G.tipT = CFG.TIP_TIME; G.tipIdx = (G.tipIdx + 1) % LINES.tips.length; }

  if (scene === 'ring') {
    if (!G.ringing) { G.wait -= dt; if (G.wait <= 0) startRing(); }
    else {
      G.ringLeft -= dt; G.ringSfxT -= dt;
      if (G.ringSfxT <= 0) { G.ringSfxT = 1.1; SFX.ring(); vib([60, 40, 60]); }
      if (G.ringLeft <= 0) {
        G.ringing = false; G.missed++; SFX.miss();
        floatT('Verpasst …', 480, 150, '#9aa0c4', 30);
        G.wait = CFG.CALL_GAP;
      }
    }
  } else if (scene === 'call') {
    const c = G.call;
    if (c.done) {
      c.endT -= dt;
      if (c.endT <= 0) { G.call = null; scene = 'ring'; G.ringing = false; G.wait = CFG.CALL_GAP; }
    } else {
      c.patience -= dt;
      if (c.patience <= 0) fail('ZU LANGE!');
    }
  }
}

/* ================= Zeichnen ================= */
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#232743'); g.addColorStop(1, '#14151f');
  ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, H + 200);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  const off = (T * 16) % 64;
  for (let x = -64 + off; x < W + 64; x += 64) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 32, 0); ctx.lineTo(x - 88, H); ctx.lineTo(x - 120, H); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-100, H - 28, W + 200, 140);
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, W, 56);
  text(`Tag ${G.day} · Schicht`, 20, 28, 20, '#f4f1e8', 'left', '800');
  const s = Math.max(0, G.shiftLeft), mm = Math.floor(s / 60), ss = String(Math.floor(s % 60)).padStart(2, '0');
  text(`${mm}:${ss}`, 400, 28, 30, s < 10 ? '#ff5d6c' : '#f4f1e8', 'center', '900');
  text(`Team ${fmt(G.team)} / ${fmt(G.quota)}`, 520, 18, 15, '#c9cde6', 'left', '700');
  bar(520, 34, 190, 10, G.team / G.quota, G.team >= G.quota ? '#5ce07a' : '#ffcc3d');
  iconBtn(790, 9, '⏸', togglePause);
  iconBtn(836, 9, SET.sound ? '🔊' : '🔇', toggleSound);
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) iconBtn(882, 9, '⛶', toggleFS);
  if (G.combo >= CFG.FIRE_COMBO) text('🔥 FEUER ×2', 20, 46, 15, '#ff8a3d', 'left', '900');
}

function pitchButtons(active) {
  PITCHES.forEach((p, i) => {
    const x = 24 + i * 228, y = 372, w = 216, h = 76;
    const hv = active && input !== 'touch' && over(x, y, w, h);
    ctx.save(); ctx.globalAlpha = active ? 1 : 0.35;
    rr(x, y, w, h, 18); ctx.fillStyle = hv ? '#44497a' : 'rgba(42,46,74,0.94)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = p.color; ctx.stroke(); ctx.restore();
    emoji(p.icon, x + 36, y + h / 2, 34);
    text(p.label, x + 68, y + h / 2, 20, '#f4f1e8', 'left', '800');
    if (input !== 'touch') text(String(i + 1), x + 14, y + 16, 14, '#9aa0c4', 'left', '700');
    if (active) hit(x, y, w, h, () => pitch(i));
  });
}

function drawGame() {
  const c = G.call, ringing = G.ringing && !c;
  drawHUD();
  if (G.combo >= CFG.FIRE_COMBO) {
    ctx.fillStyle = `rgba(255,120,40,${0.05 + 0.03 * Math.sin(T * 6)})`; ctx.fillRect(0, 0, W, H);
  }
  // Anrufer-Karte
  panel(24, 72, 316, 286);
  if (c) {
    ctx.save(); ctx.translate(182, 168 + Math.sin(T * 2.2) * 3); ctx.scale(c.sx, c.sy);
    emoji(c.v.emoji, 0, 0, 96); ctx.restore();
    const r = c.sus > 60 ? '😠' : c.sus > 30 ? '🤨' : c.trust >= 70 ? '😍' : '🙂';
    emoji(r, 282, 112, 30);
    text(c.v.name, 182, 248, 22, '#f4f1e8', 'center', '800');
    text('Typ: ' + (c.tagKnown ? c.v.tag : '???'), 182, 272, 16, '#b9bdd9', 'center', '600');
    meter('Vertrauen', c.trust / 100, '#5ce07a', 296);
    meter('Verdacht', c.sus / 100, '#ff5d6c', 318);
    meter('Geduld', c.patience / c.patMax, '#ffcc3d', 340);
  } else if (ringing) {
    ctx.save(); ctx.translate(182, 168); ctx.rotate(Math.sin(T * 28) * 0.22); emoji('📞', 0, 0, 96); ctx.restore();
    text('Eingehender Anruf', 182, 248, 22, '#f4f1e8', 'center', '800');
    bar(60, 268, 244, 10, G.ringLeft / G.ringMax, '#5bc0ff');
  } else {
    text('…', 182, 168, 60, '#555a78', 'center', '800');
    text('Nächster Anruf in Kürze', 182, 248, 18, '#9aa0c4', 'center', '600');
  }
  // Sprechblase
  panel(362, 72, 574, 172);
  if (c) {
    wrap(c.line.slice(0, Math.floor(c.shown)), 388, 104, 524, 30, 24, '#f4f1e8');
    panel(362, 256, 574, 88);
    text('Dein Ansatz', 388, 280, 15, '#9aa0c4', 'left', '700');
    if (c.last) text(`${c.last.icon}  ${c.last.label}  →  ${FEEDBACK[c.lastKind]}`, 388, 312, 24, '#f4f1e8', 'left', '800');
    else text('Noch nichts gesagt. Erst mal zuhören.', 388, 312, 20, '#9aa0c4', 'left', '600');
  } else if (ringing) {
    wrap('Jemand ruft an. Vielleicht eine Chance – oder eine Oma mit Fragen.', 388, 116, 524, 30, 24, '#f4f1e8');
    panel(362, 256, 574, 88);
    text(`Noch ${Math.max(0, G.ringLeft).toFixed(1)} s zum Abnehmen`, 388, 300, 20, '#5bc0ff', 'left', '800');
  } else {
    wrap('Die Leitung ist still. Kurz durchatmen.', 388, 116, 524, 30, 24, '#9aa0c4');
  }
  // Untere Zone: Abnehmen, Ansätze oder Tipp
  if (ringing) {
    button(24, 372, 912, 76, input === 'touch' ? 'Abnehmen  (oder nach oben wischen)' : 'Abnehmen  [Enter]', answer, { size: 26, stroke: '#5bc0ff' });
  } else if (c) {
    pitchButtons(!c.done);
  } else {
    panel(24, 372, 912, 76);
    text(LINES.tips[G.tipIdx], 480, 410, 20, '#c9cde6', 'center', '600');
  }
  text('Alles fiktiv. Alles erfunden. Alles sehr witzig.', 480, 522, 13, '#6c7194', 'center', '600');
}

function drawTitle() {
  text('MASCHE & Co.', 480, 120, 68, '#ffcc3d', 'center', '900');
  text('Callcenter-Chaos mit deinen Freunden – alles fiktiv, alles erfunden', 480, 176, 18, '#c9cde6', 'center', '600');
  emoji('📞', 200, 120, 56); emoji('🤑', 760, 120, 56);
  button(330, 226, 300, 64, '▶  Schicht beginnen', startGame, { size: 26 });
  [['🔊', 'Ton', 'sound'], ['📳', 'Vibration', 'vib'], ['💥', 'Wackeln', 'shake']].forEach((r, i) =>
    button(170 + i * 215, 312, 200, 46, `${r[0]} ${r[1]}: ${SET[r[2]] ? 'an' : 'aus'}`, () => {
      SET[r[2]] = !SET[r[2]]; save('masche.set', SET); SFX.click();
    }, { size: 17 }));
  text('Highscore: ' + fmt(hiScore), 480, 392, 22, '#ffcc3d', 'center', '800');
  const lines = input === 'touch'
    ? ['Tippe einen Ansatz an. Nach oben wischen oder „Abnehmen“ tippen.', 'Tipp: Quer halten, dann siehst du mehr vom Chaos.']
    : ['Tasten 1–4 = Ansatz · Enter = abnehmen · P = Pause', 'M = Ton · F = Vollbild · Maus geht überall'];
  lines.forEach((l, i) => text(l, 480, 440 + i * 24, 16, '#9aa0c4', 'center', '600'));
}

function drawReview() {
  panel(150, 40, 660, 460);
  text('Feedback vom Chef', 480, 84, 30, '#ffcc3d', 'center', '900');
  emoji('👔', 230, 170, 72);
  wrap(G.quip, 300, 130, 480, 26, 19, '#f4f1e8');
  text(`Team: ${fmt(G.team)}   ·   Quota: ${fmt(G.quota)}`, 480, 226, 20, '#f4f1e8', 'center', '800');
  bar(230, 250, 500, 18, G.team / G.quota, G.reviewOK ? '#5ce07a' : '#ff5d6c');
  text(`Erfolgreich: ${G.okCalls}   ·   Aufgelegt: ${G.failCalls}   ·   Verpasst: ${G.missed}`, 480, 300, 18, '#c9cde6', 'center', '700');
  text(`Beste Combo: ${G.bestCombo}`, 480, 330, 18, '#c9cde6', 'center', '700');
  button(370, 400, 220, 56, G.reviewOK ? 'Weiter ▶' : 'Zum Ende', continueReview, { size: 22 });
}

function drawUpgrade() {
  text('Befördert! Wähle ein Upgrade', 480, 96, 34, '#ffcc3d', 'center', '900');
  text('Der Chef ist beeindruckt. Mehr oder weniger.', 480, 136, 18, '#c9cde6', 'center', '600');
  G.upgChoices.forEach((u, i) => {
    const x = 110 + i * 260, y = 176, w = 240, h = 260;
    const hv = input !== 'touch' && over(x, y, w, h);
    ctx.save(); rr(x, y, w, h, 20); ctx.fillStyle = hv ? '#3d4370' : '#262a3d'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffcc3d'; ctx.stroke(); ctx.restore();
    emoji(u.icon, x + w / 2, y + 70, 64);
    text(u.name, x + w / 2, y + 140, 22, '#f4f1e8', 'center', '800');
    wrap(u.desc, x + 22, y + 172, w - 44, 24, 18, '#c9cde6');
    hit(x, y, w, h, () => chooseUpgrade(u));
  });
}

function drawOver() {
  panel(170, 60, 620, 420);
  text('GEFEUERT!', 480, 116, 60, '#ff5d6c', 'center', '900');
  wrap(G.overQuip, 480, 170, 500, 28, 22, '#f4f1e8', 'center');
  text(`Geschaffte Schichten: ${G.day - 1}`, 480, 270, 20, '#c9cde6', 'center', '700');
  text(`Verdient insgesamt: ${fmt(G.total)}`, 480, 302, 20, '#c9cde6', 'center', '700');
  text(`Rekord: ${fmt(hiScore)}`, 480, 334, 20, '#ffcc3d', 'center', '800');
  button(370, 400, 220, 56, 'Nochmal ↻', newGame, { size: 22 });
}

function drawPause() {
  panel(280, 110, 400, 320);
  text('Pause', 480, 158, 40, '#ffcc3d', 'center', '900');
  button(330, 196, 300, 50, '▶  Weiter', togglePause, { size: 22 });
  button(330, 262, 300, 50, SET.sound ? '🔊  Ton: an' : '🔇  Ton: aus', toggleSound, { size: 20 });
  button(330, 328, 300, 50, '⌂  Hauptmenü', goTitle, { size: 20 });
}

function drawFX() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floats) { ctx.globalAlpha = Math.max(0, 1 - f.t / f.life); text(f.s, f.x, f.y, f.size, f.c, 'center', '900'); }
  ctx.globalAlpha = 1;
  for (const s of stamps) {
    const p = s.t / s.life, k = p < 0.12 ? lerp(2.2, 1, p / 0.12) : 1;
    ctx.save(); ctx.globalAlpha = p > 0.75 ? 1 - (p - 0.75) / 0.25 : 1;
    ctx.translate(480, 236); ctx.rotate(-0.06); ctx.scale(k, k);
    text(s.s, 4, 4, s.size, 'rgba(0,0,0,0.5)', 'center', '900');
    text(s.s, 0, 0, s.size, s.c, 'center', '900');
    ctx.restore();
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#14151f'; ctx.fillRect(0, 0, innerWidth, innerHeight);
  hits = [];
  ctx.save();
  ctx.translate(VP.ox, VP.oy); ctx.scale(VP.sc, VP.sc);
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const sh = SET.shake && G.shake > 0 ? G.shake : 0;
  ctx.translate(rnd(-sh, sh), rnd(-sh, sh));
  switch (scene) {
    case 'title':   drawBG(); drawTitle(); break;
    case 'ring':
    case 'call':    drawBG(); drawGame(); break;
    case 'review':  drawBG(); drawGame(); dim(0.72); drawReview(); break;
    case 'upgrade': drawBG(); dim(0.5); drawUpgrade(); break;
    case 'over':    drawBG(); dim(0.55); drawOver(); break;
    case 'pause':   drawBG(); drawGame(); dim(0.6); drawPause(); break;
  }
  drawFX();
  ctx.restore();
}

/* ================= Layout, Ausrichtung, Sicherheitsbereich ================= */
function layout() {
  dpr = Math.min(3, window.devicePixelRatio || 1);
  const vw = innerWidth, vh = innerHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
  const s = getComputedStyle($('safe'));
  const t = parseFloat(s.paddingTop) || 0, r = parseFloat(s.paddingRight) || 0,
        b = parseFloat(s.paddingBottom) || 0, l = parseFloat(s.paddingLeft) || 0;
  const aw = vw - l - r, ah = vh - t - b, sc = Math.min(aw / W, ah / H);
  VP = { sc, ox: l + (aw - W * sc) / 2, oy: t + (ah - H * sc) / 2 };
  checkRotate();
}
function checkRotate() {
  $('rotate').classList.toggle('show', input === 'touch' && innerHeight > innerWidth && !rotOK);
}
function toLogical(e) { return { x: (e.clientX - VP.ox) / VP.sc, y: (e.clientY - VP.oy) / VP.sc }; }

/* ================= Eingaben ================= */
canvas.addEventListener('pointerdown', e => {
  audio(); setInput(e.pointerType);
  const p = toLogical(e);
  G.mx = p.x; G.my = p.y; G.downX = e.clientX; G.downY = e.clientY; G.downT = performance.now();
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { h.fn(); break; }
  }
});
canvas.addEventListener('pointermove', e => {
  const p = toLogical(e); G.mx = p.x; G.my = p.y;
  if (e.pointerType === 'mouse') setInput('mouse');
});
canvas.addEventListener('pointerup', e => {
  // Wischen nach oben nimmt ab
  if (scene === 'ring' && G.ringing && e.clientY < G.downY - 50 && performance.now() - G.downT < 700) answer();
});
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  audio(); setInput('mouse');
  const k = e.key.toLowerCase();
  if (scene === 'call' && ['1', '2', '3', '4'].includes(k)) { e.preventDefault(); pitch(+k - 1); return; }
  if (scene === 'upgrade' && ['1', '2', '3'].includes(k) && G.upgChoices[+k - 1]) { chooseUpgrade(G.upgChoices[+k - 1]); return; }
  if (k === 'enter' || k === ' ') { e.preventDefault(); primary(); return; }
  if (k === 'p' || k === 'escape') { if (scene !== 'title' && scene !== 'over') togglePause(); return; }
  if (k === 'm') toggleSound();
  if (k === 'f') toggleFS();
  if (k === 'r' && scene === 'over') newGame();
});
function primary() {
  if (scene === 'title') startGame();
  else if (scene === 'ring') answer();
  else if (scene === 'review') continueReview();
  else if (scene === 'over') newGame();
  else if (scene === 'pause') togglePause();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('blur', autoPause);
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('resize', layout);
addEventListener('orientationchange', layout);
$('stayPortrait').addEventListener('click', () => { rotOK = true; checkRotate(); });
const mq = matchMedia('(pointer: coarse)');
if (mq.addEventListener) mq.addEventListener('change', e => setInput(e.matches ? 'touch' : 'mouse'));

/* ================= Schleife (Delta-Time, Frame-unabhängig) ================= */
layout();
let last = performance.now();
requestAnimationFrame(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; T += dt;
  update(dt);
  render();
  requestAnimationFrame(loop);
});
</script>
</body>
